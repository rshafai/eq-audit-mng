# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: gc.agr.aafc.mm.eqauditmng
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        log: 5
        target:
          url: https://tmqpas01.agr.gc.ca:44333/
          client: '100'
        app:
          name: ZQMM_EQ_AUDMN
          description: Equipment Audit Manage
          package: zqmm_eq_audit
          transport: TMQK900331
        exclude:
          - /test/
